services:
  # Backend server: FastAPI (API + Swagger docs at /docs) and the SQLite database.
  # SQLite is embedded in the FastAPI process, so the database file lives in this
  # container on a named volume; it is not reachable from the host directly.
  parking-api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8002:8000"
    volumes:
      - parking-v2-data:/app/data
    environment:
      PARKING_DB: "/app/data/parking.sqlite3"
      PARKING_FLOORS: "11"
      BAYS_PER_FLOOR: "100"
      SEED_DEMO: "true"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Frontend server: nginx serves the static UI and proxies /api to the backend.
  parking-frontend:
    image: nginx:1.27-alpine
    ports:
      - "127.0.0.1:3000:80"
    volumes:
      - ./static:/usr/share/nginx/html/static:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      parking-api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  parking-v2-data:
