services:
  parking:
    build: .
    ports:
      - "127.0.0.1:8002:8000"
    volumes:
      - parking-v2-data:/app/data
    environment:
      PARKING_FLOORS: 11
      BAYS_PER_FLOOR: 100
      SEED_DEMO: "true"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  parking-v2-data:
